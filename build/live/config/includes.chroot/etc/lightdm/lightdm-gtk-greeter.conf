# Carsai OS - LightDM greeter branding
# Uses the default theme (Carsai Neon) and the project wallpaper.
[greeter]
theme-name = Carsai-Neon
icon-theme-name = Adwaita
background = /usr/share/backgrounds/carsai/carsai-neon.png
user-background = false
font-name = Noto Sans 10
indicators = ~host;~spacer;~clock;~spacer;~layout;~session;~power
clock-format = %d/%m/%Y %H:%M
