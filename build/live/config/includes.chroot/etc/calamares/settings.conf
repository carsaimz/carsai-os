# Configuration file for Calamares — Carsai OS
# Syntax is YAML 1.2
---
# "local" is LIBDIR/calamares/modules with settings in SHARE/calamares/modules
modules-search: [ local ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
prompt-install: false
dont-chroot: false

sequence:
# Phase 1 - prepare.
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary

# Phase 2 - install.
# Only standard modules shipped in the Debian `calamares` package are used
# (no calamares-settings-debian custom modules). The target system is a full
# copy of the live squashfs, so the kernel/initramfs are already in place.
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - grubcfg
  - bootloader
  - umount

# Phase 3 - postinstall.
- show:
  - finished

branding: carsai
