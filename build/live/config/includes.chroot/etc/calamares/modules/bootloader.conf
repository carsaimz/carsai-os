# Bootloader configuration — GRUB2 (BIOS + EFI), Debian style.
---
# Options: 'grub', 'sb-shim' and 'systemd-boot' (Debian calamares 3.2.61).
efiBootLoader: "grub"

# GRUB 2 binary names and boot directory
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Optionally set the bootloader ID used by grub-install --bootloader-id.
# If unset, bootloaderEntryName from branding.desc is used ("CarsaiOS").
# efiBootloaderId: "carsai"

installEFIFallback: false
