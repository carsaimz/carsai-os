---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false

requirements:
    # GiB. ISO ~1.3 GB unpacks to ~4.5 GB; 6 GiB leaves slack on 8 GB disks.
    requiredStorage:    6
    # Carsai OS minimum is 2 GB of RAM (docs/02).
    requiredRam:        2.0
    check:
        - storage
        - ram
        - root
    required:
        - storage
        - ram
        - root
